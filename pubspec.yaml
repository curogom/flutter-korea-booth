name: flutter_korea_booth
description: "Bilingual demo quiz with optional Firebase question management."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  firebase_analytics: ^13.0.1
  crypto: ^3.0.8
  sembast: ^3.10.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
  assets:
    - assets/data/
  uses-material-design: true
